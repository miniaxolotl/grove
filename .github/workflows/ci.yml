name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Frozen promotion PR number (omit for source CI)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: Promotion Admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Lint GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh
      - run: node --test scripts/release/promotion.test.mjs
      - run: node scripts/release/promotion.mjs admit
        env:
          GH_TOKEN: ${{ github.token }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [promotion, website, contracts, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:website
      - run: pnpm check-types:website
      - run: pnpm build:website
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_POSTHOG_ENABLED: "true"
          NEXT_PUBLIC_POSTHOG_KEY: phc_playwright_only
          NEXT_PUBLIC_SENTRY_ENABLED: "true"
          NEXT_PUBLIC_SENTRY_DSN: https://00000000000000000000000000000000@o0.ingest.us.sentry.io/1
      - run: node scripts/performance/website-bundles.mjs --check
      - run: pnpm --filter website exec playwright install --with-deps chromium
      - run: pnpm test:website

  contracts:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:grove_test@127.0.0.1:5432/grove_test
      TEST_DATABASE_URL: postgresql://grove_api:grove_disposable_api@127.0.0.1:5432/grove_test
      TEST_WORKER_DATABASE_URL: postgresql://grove_jobs:grove_disposable_worker@127.0.0.1:5432/grove_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env: { POSTGRES_DB: grove_test, POSTGRES_PASSWORD: grove_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d grove_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --test tests/digitalocean.test.mjs
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test:db:setup
      - run: pnpm test
      - run: pnpm test:artifacts

  image:
    name: Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
