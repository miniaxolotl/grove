name: CI
on:
  push:
    branches: [production, development]
  pull_request:
    branches: [development, production]
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Frozen promotion PR number (omit for source CI)
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  promotion:
    name: Promotion Admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node --test scripts/release/promotion.test.mjs
      - run: node scripts/release/promotion.mjs admit
        env:
          GH_TOKEN: ${{ github.token }}

  gate:
    name: CI Gate
    if: always()
    needs: [promotion, website, contracts, image]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:website
      - run: pnpm check-types:website
      - run: pnpm build:website
      - run: pnpm --filter website exec playwright install --with-deps chromium
      - run: pnpm test:website

  contracts:
    runs-on: ubuntu-latest
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:grove_test@127.0.0.1:5432/grove_test
      TEST_DATABASE_URL: postgresql://grove_api:grove_disposable_api@127.0.0.1:5432/grove_test
      TEST_WORKER_DATABASE_URL: postgresql://grove_jobs:grove_disposable_worker@127.0.0.1:5432/grove_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env: { POSTGRES_DB: grove_test, POSTGRES_PASSWORD: grove_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d grove_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node --test tests/digitalocean.test.mjs
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm check-types
      - run: pnpm build
      - run: pnpm test:db:setup
      - run: pnpm test
      - run: pnpm test:artifacts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
