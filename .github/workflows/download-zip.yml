name: Released browser download
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Approved GitHub download
        required: true
        type: choice
        options: [edge, firefox]
permissions: {}
concurrency:
  group: released-download-v1125-${{ inputs.browser }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    if: github.repository == 'miniaxolotl/grove' && github.ref == 'refs/heads/production' && github.ref_protected && github.actor == 'miniaxolotl' && github.triggering_actor == 'miniaxolotl'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @monorepo/grove --fail-if-no-match
      - name: Verify released source CI, publish one ZIP and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_TARGET: ${{ inputs.browser }}
        run: node scripts/release/download-zip.mjs
