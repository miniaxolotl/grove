name: Verify website delivery scope
on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
    outputs:
      config:
        value: ${{ jobs.compare.outputs.config }}
permissions:
  contents: read
  pull-requests: read
jobs:
  compare:
    outputs:
      config: ${{ steps.scope.outputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: node scripts/release/proofing-release.mjs "$EXPECTED_SOURCE"
      - if: steps.scope.outputs.mode == 'website-only'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.mode == 'website-only'
        name: Rebuild comparable package and ZIP inventories before any write
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          node scripts/release/select-website.mjs
      - if: steps.scope.outputs.mode == 'website-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-selection-${{ inputs.source }}-${{ github.run_attempt }}
          path: website-selection.json
          if-no-files-found: error
          retention-days: 90
