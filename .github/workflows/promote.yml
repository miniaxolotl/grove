name: Select Release Candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released immutable vX.Y.Z to promote
        type: string
        required: true
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: select-release-candidate
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/development' && github.actor == 'miniaxolotl' && github.triggering_actor == 'miniaxolotl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze the released candidate and open a protected PR
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release/promotion.mjs open "$TAG" production
      - uses: actions/upload-artifact@v4
        with:
          name: selected-candidate-${{ github.run_attempt }}
          path: selection.json
          retention-days: 90
          if-no-files-found: error
      - name: Dispatch CI for the bot-authored frozen PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ steps.selection.outputs.pr }}
        run: node scripts/release/dispatch-ci.mjs
