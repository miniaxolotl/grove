name: Source Release
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release-please-development
  cancel-in-progress: false
jobs:
  release-please:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0; release-please 17.6.0
        id: release
        with:
          token: ${{ github.token }}
          target-branch: development
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.release.outputs.prs_created == 'true'
        with: { node-version: 24 }
      - name: Explicit CI dispatch for token-authored release PRs
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: node scripts/release/dispatch-ci.mjs
