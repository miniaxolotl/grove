name: Release

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      grove--tag_name: ${{ steps.release.outputs['packages/mcp--tag_name'] }}
      grove--release_created: ${{ steps.release.outputs['packages/mcp--release_created'] }}
      grove-opencode-plugin--tag_name: ${{ steps.release.outputs['packages/grove-opencode-plugin--tag_name'] }}
      grove-opencode-plugin--release_created: ${{ steps.release.outputs['packages/grove-opencode-plugin--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish MCP
        if: ${{ needs.release-please.outputs['grove--release_created'] == 'true' }}
        run: |
          cd packages/mcp && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Plugin
        if: ${{ needs.release-please.outputs['grove-opencode-plugin--release_created'] == 'true' }}
        run: |
          cd packages/grove-opencode-plugin && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
