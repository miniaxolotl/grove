name: Release

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./packages/mcp/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check npm
        id: npm-check
        run: |
          if npm view @miniaxolotl/grove version 2>/dev/null | grep -q "^${{ steps.version.outputs.VERSION }}$"; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.published != 'true'
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" 2>/dev/null; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
