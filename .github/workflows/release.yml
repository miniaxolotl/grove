name: Release

on:
  push:
    branches: [development]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      grove--tag_name: ${{ steps.release.outputs['grove--tag_name'] }}
      grove--release_created: ${{ steps.release.outputs['grove--release_created'] }}
      grove-opencode-plugin--tag_name: ${{ steps.release.outputs['grove-opencode-plugin--tag_name'] }}
      grove-opencode-plugin--release_created: ${{ steps.release.outputs['grove-opencode-plugin--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish MCP
        run: |
          cd packages/mcp && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Plugin
        run: |
          cd packages/grove-opencode-plugin && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
