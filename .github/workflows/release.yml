name: Release

on:
  push:
    branches: [development, production]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Check versions
        id: versions
        run: |
          LOCAL_MCP=$(node -p "require('./packages/mcp/package.json').version")
          LOCAL_PLUGIN=$(node -p "require('./packages/grove-opencode-plugin/package.json').version")
          NPM_MCP=$(npm view @miniaxolotl/grove version 2>/dev/null || echo "none")
          NPM_PLUGIN=$(npm view @miniaxolotl/grove-opencode-plugin version 2>/dev/null || echo "none")
          echo "MCP local=$LOCAL_MCP npm=$NPM_MCP"
          echo "Plugin local=$LOCAL_PLUGIN npm=$NPM_PLUGIN"
          [ "$LOCAL_MCP" != "$NPM_MCP" ] && echo "PUBLISH_MCP=true" >> $GITHUB_OUTPUT || echo "PUBLISH_MCP=false" >> $GITHUB_OUTPUT
          [ "$LOCAL_PLUGIN" != "$NPM_PLUGIN" ] && echo "PUBLISH_PLUGIN=true" >> $GITHUB_OUTPUT || echo "PUBLISH_PLUGIN=false" >> $GITHUB_OUTPUT

      - name: Publish MCP
        if: steps.versions.outputs.PUBLISH_MCP == 'true'
        run: pnpm --filter @miniaxolotl/grove publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Plugin
        if: steps.versions.outputs.PUBLISH_PLUGIN == 'true'
        run: pnpm --filter @miniaxolotl/grove-opencode-plugin publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
