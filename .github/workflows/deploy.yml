name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
env:
  # Match the production image; no runner needs ONNX's optional CUDA download.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
jobs:
  candidate:
    if: github.repository == 'miniaxolotl/grove' && github.ref == 'refs/heads/production' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Wait for complete independent production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs wait-ci "$GITHUB_SHA"
      - id: candidate
        name: Admit the immutable source before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs production "$GITHUB_SHA"

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
      GROVE_TELEMETRY_BUILD: production
      GROVE_POSTHOG_KEY: ${{ secrets.GROVE_POSTHOG_KEY }}
      GROVE_CLI_SENTRY_DSN: ${{ secrets.GROVE_CLI_SENTRY_DSN }}
      GROVE_API_SENTRY_DSN: ${{ secrets.GROVE_API_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify candidate schema with read-only runtime probes
        env:
          GROVE_API_DATABASE_URL: ${{ secrets.GROVE_API_DATABASE_URL }}
          GROVE_WORKER_DATABASE_URL: ${{ secrets.GROVE_WORKER_DATABASE_URL }}
        run: node --import tsx scripts/release/database-preflight.mjs
      - run: pnpm build
      - run: pnpm test:artifacts
      - name: Preflight credentials, target and every package
        run: |
          node scripts/ci/current-ref.mjs
          node scripts/release/preflight-production.mjs
          npm whoami
          node scripts/release/website.mjs preflight
          node scripts/release/assets.mjs preflight
          node scripts/publish.mjs --dry-run
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Preflight every component in GHCR and Docker Hub
        run: node scripts/release/container-images.mjs preflight
      - name: Read only public website build configuration from the existing production project
        run: node scripts/release/website.mjs image-config
      - name: Upload exact-source diagnostics maps and release linkage
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: node scripts/release/telemetry-release.mjs
      - id: image
        name: Build or reuse and verify API, MCP, Website and LanguageTool images in both registries
        run: node scripts/release/container-images.mjs prepare
      - name: Validate the existing topology before npm publication
        env:
          GROVE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/ci/current-ref.mjs
          [[ "$GROVE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          node scripts/deploy-digitalocean.mjs --propose
      - name: Publish all coordinated npm artifacts
        run: node scripts/publish.mjs
      - name: Promote and verify all four component images
        env:
          GROVE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/ci/current-ref.mjs
          [[ "$GROVE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          node scripts/release/container-images.mjs promote
          jq -n --arg sha "$RELEASE_SOURCE_SHA" --arg tag "$RELEASE_TAG" --arg digest "$GROVE_IMAGE_DIGEST" \
            '{sha:$sha,tag:$tag,image:"ghcr.io/miniaxolotl/grove",digest:$digest}' > manifest.json
      - name: Attach verified browser downloads to the source release
        run: node scripts/release/assets.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.candidate.outputs.tag }}-${{ github.run_attempt }}
          path: |
            manifest.json
            container-images.json
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      GROVE_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - run: pnpm install --frozen-lockfile
      - name: Reject a superseded production operation
        run: node scripts/ci/current-ref.mjs
      - name: Recheck candidate schema with read-only runtime probes
        env:
          GROVE_API_DATABASE_URL: ${{ secrets.GROVE_API_DATABASE_URL }}
          GROVE_WORKER_DATABASE_URL: ${{ secrets.GROVE_WORKER_DATABASE_URL }}
        run: node --import tsx scripts/release/database-preflight.mjs
      - name: Deploy the verified image to API and worker
        run: node scripts/deploy-digitalocean.mjs --wait
      - name: Verify production API readiness
        run: curl --fail --retry 5 --max-time 30 https://api.grovenote.app/health/ready

  website:
    needs: [candidate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify backend readiness before website delivery
        run: curl --fail --retry 3 --max-time 30 https://api.grovenote.app/health/ready
      - name: Build and deploy the admitted website
        run: node scripts/release/website.mjs deploy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ needs.candidate.outputs.tag }}-${{ github.run_attempt }}
          path: website-deployment.json
          retention-days: 90
          if-no-files-found: error
