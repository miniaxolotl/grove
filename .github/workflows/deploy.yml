name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'miniaxolotl/grove' && github.ref == 'refs/heads/production' && github.ref_protected == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Wait for complete independent production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs wait-ci "$GITHUB_SHA"
      - id: candidate
        name: Admit the immutable source before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs production "$GITHUB_SHA"

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; pnpm 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:artifacts
      - name: Preflight credentials, target and every package
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
          npm whoami
          node scripts/release/preflight-production.mjs
          node scripts/publish.mjs --dry-run
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve existing immutable images without suppressing registry failures
        id: existing
        run: |
          inspect() {
            local digest
            if digest="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>image-error)"; then
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              printf '%s' "$digest"
            elif ! grep -Eqi 'not found|manifest unknown|no such manifest' image-error; then
              cat image-error >&2
              return 1
            fi
          }
          digest="$(inspect "ghcr.io/miniaxolotl/grove:sha-$RELEASE_SOURCE_SHA")"
          for repository in ghcr.io/miniaxolotl/grove miniaxolotl/grove; do
            for tag in "sha-$RELEASE_SOURCE_SHA" "$RELEASE_TAG"; do
              existing="$(inspect "$repository:$tag")"
              if [[ -n "$existing" && "$existing" != "$digest" ]]; then exit 1; fi
            done
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/miniaxolotl/grove:sha-${{ needs.candidate.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/miniaxolotl/grove
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish all coordinated npm artifacts
        run: node scripts/publish.mjs
      - id: image
        name: Promote and verify the immutable image
        env:
          GROVE_IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
          [[ "$GROVE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          source="ghcr.io/miniaxolotl/grove@$GROVE_IMAGE_DIGEST"
          docker pull "$source"
          test "$(docker inspect "$source" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SOURCE_SHA"
          for repository in ghcr.io/miniaxolotl/grove miniaxolotl/grove; do
            for tag in "sha-$RELEASE_SOURCE_SHA" "$RELEASE_TAG" latest; do
              docker buildx imagetools create --prefer-index=false --tag "$repository:$tag" "$source"
              test "$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')" = "$GROVE_IMAGE_DIGEST"
            done
          done
          echo "digest=$GROVE_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          jq -n --arg sha "$RELEASE_SOURCE_SHA" --arg tag "$RELEASE_TAG" --arg digest "$GROVE_IMAGE_DIGEST" \
            '{sha:$sha,tag:$tag,image:"ghcr.io/miniaxolotl/grove",digest:$digest}' > manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.candidate.outputs.tag }}-${{ github.run_attempt }}
          path: manifest.json
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      GROVE_IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
      - name: Reject a superseded production operation
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Deploy the verified image to API and worker
        run: node scripts/deploy-digitalocean.mjs --wait
      - name: Verify production API readiness
        run: curl --fail --retry 5 --max-time 30 https://api.usegrove.cloud/health/ready
