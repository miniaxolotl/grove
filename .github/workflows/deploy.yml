name: Deploy
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wait for complete independent production CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs wait-ci "$GITHUB_SHA"
      - id: candidate
        name: Admit the immutable source before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs production "$GITHUB_SHA"

  publish-and-deploy:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
      RELEASE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:artifacts
      - name: Preflight credentials, target and every package
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
          npm whoami
          node scripts/release/preflight-production.mjs
          node scripts/publish.mjs --dry-run
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve existing immutable images without suppressing registry failures
        id: existing
        run: |
          inspect() {
            local digest
            if digest="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>image-error)"; then
              [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || return 1
              printf '%s' "$digest"
            elif ! grep -Eqi 'not found|manifest unknown|no such manifest' image-error; then
              cat image-error >&2
              return 1
            fi
          }
          digest="$(inspect "ghcr.io/miniaxolotl/grove:sha-$RELEASE_SOURCE_SHA")"
          for repository in ghcr.io/miniaxolotl/grove miniaxolotl/grove; do
            for tag in "sha-$RELEASE_SOURCE_SHA" "$RELEASE_TAG"; do
              existing="$(inspect "$repository:$tag")"
              if [[ -n "$existing" && "$existing" != "$digest" ]]; then exit 1; fi
            done
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/miniaxolotl/grove:sha-${{ needs.candidate.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.candidate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.candidate.outputs.sha }}
            org.opencontainers.image.source=https://github.com/miniaxolotl/grove
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish all coordinated npm artifacts
        run: node scripts/publish.mjs
      - name: Promote the verified image, then deploy API and worker
        env:
          GROVE_IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq .object.sha)" = "$GITHUB_SHA"
          [[ "$GROVE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          source="ghcr.io/miniaxolotl/grove@$GROVE_IMAGE_DIGEST"
          docker pull "$source"
          test "$(docker inspect "$source" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$RELEASE_SOURCE_SHA"
          for repository in ghcr.io/miniaxolotl/grove miniaxolotl/grove; do
            for tag in "sha-$RELEASE_SOURCE_SHA" "$RELEASE_TAG" latest; do
              docker buildx imagetools create --prefer-index=false --tag "$repository:$tag" "$source"
              test "$(docker buildx imagetools inspect "$repository:$tag" --format '{{.Manifest.Digest}}')" = "$GROVE_IMAGE_DIGEST"
            done
          done
          node scripts/deploy-digitalocean.mjs --wait
          curl --fail --retry 5 --max-time 30 https://api.usegrove.cloud/health/ready
          jq -n --arg sha "$RELEASE_SOURCE_SHA" --arg tag "$RELEASE_TAG" --arg digest "$GROVE_IMAGE_DIGEST" \
            '{sha:$sha,tag:$tag,image:"ghcr.io/miniaxolotl/grove",digest:$digest}' > manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.candidate.outputs.tag }}-${{ github.run_attempt }}
          path: manifest.json
