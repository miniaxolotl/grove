name: grove

x-runtime: &runtime
  NODE_ENV: production
  PORT: 26080
  DATABASE_SSL: disable
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
  DATABASE_ACQUIRE_TIMEOUT_MS: ${DATABASE_ACQUIRE_TIMEOUT_MS:-2000}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
  API_ORIGIN: ${API_ORIGIN:-http://localhost:26080}
  SITE_URL: ${SITE_URL:-http://localhost:3000}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set Grove Clerk keys}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set Grove Clerk keys}
  CLERK_ISSUER: ${CLERK_ISSUER:?Set Grove Clerk issuer}
  CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?Set Clerk webhook signing secret}
  CURSOR_SECRET: ${CURSOR_SECRET:?Generate a random cursor signing secret}
  EMBEDDING_MODE: ${EMBEDDING_MODE:-local}
  EMBEDDING_CACHE: /app/data/models
  GROVE_EDITION: ${GROVE_EDITION:-self-hosted}
  BILLING_CONFIGURED: ${BILLING_CONFIGURED:-false}
  FLAGS: ${FLAGS:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRO_PRODUCT_ID: ${STRIPE_PRO_PRODUCT_ID:-}
  STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
  STRIPE_PRO_MONTHLY_PRICE_ID: ${STRIPE_PRO_MONTHLY_PRICE_ID:-}
  STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
  BILLING_FREE_GENERATION_DAILY: ${BILLING_FREE_GENERATION_DAILY:-1000}
  BILLING_FREE_GENERATION_MONTHLY: ${BILLING_FREE_GENERATION_MONTHLY:-31000}
  BILLING_PRO_GENERATION_DAILY: ${BILLING_PRO_GENERATION_DAILY:-5000}
  BILLING_PRO_GENERATION_MONTHLY: ${BILLING_PRO_GENERATION_MONTHLY:-155000}
  BILLING_FREE_RESEARCH_DAILY: ${BILLING_FREE_RESEARCH_DAILY:-20}
  BILLING_FREE_RESEARCH_MONTHLY: ${BILLING_FREE_RESEARCH_MONTHLY:-620}
  BILLING_PRO_RESEARCH_DAILY: ${BILLING_PRO_RESEARCH_DAILY:-100}
  BILLING_PRO_RESEARCH_MONTHLY: ${BILLING_PRO_RESEARCH_MONTHLY:-3100}
  BILLING_FREE_TRANSCRIPTION_MONTHLY_MS: ${BILLING_FREE_TRANSCRIPTION_MONTHLY_MS:-7200000}
  BILLING_PRO_TRANSCRIPTION_MONTHLY_MS: ${BILLING_PRO_TRANSCRIPTION_MONTHLY_MS:-28800000}
  BILLING_FREE_SYNTHESIS_MONTHLY_MS: ${BILLING_FREE_SYNTHESIS_MONTHLY_MS:-7200000}
  BILLING_PRO_SYNTHESIS_MONTHLY_MS: ${BILLING_PRO_SYNTHESIS_MONTHLY_MS:-28800000}
  MODEL_ADMIN_SUBJECTS: ${MODEL_ADMIN_SUBJECTS:-}
  MODEL_SETTINGS_KEY: ${MODEL_SETTINGS_KEY:-}
  DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
  MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SPEECH_ENABLED: ${SPEECH_ENABLED:-false}
  MINIMAX_TTS_ENABLED: ${MINIMAX_TTS_ENABLED:-false}
  TTS_VOICE: ${TTS_VOICE:-alloy}
  SPEECH_PROVIDER_CONCURRENCY: ${SPEECH_PROVIDER_CONCURRENCY:-2}
  EMBEDDING_URL: ${EMBEDDING_URL:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  EMBEDDING_QUERY_PREFIX:
  EMBEDDING_DOCUMENT_PREFIX:
  EMBEDDING_DISTANCE_THRESHOLD: ${EMBEDDING_DISTANCE_THRESHOLD:-}
  DECISION_PROVIDER: ${DECISION_PROVIDER:-disabled}
  DECISION_URL: ${DECISION_URL:-}
  DECISION_MODEL: ${DECISION_MODEL:-}
  DECISION_API_KEY: ${DECISION_API_KEY:-}
  DECISION_PATH: ${DECISION_PATH:-/decisions}
  GENERATION_PROVIDER: ${GENERATION_PROVIDER:-disabled}
  GENERATION_URL: ${GENERATION_URL:-}
  GENERATION_MODEL: ${GENERATION_MODEL:-}
  GENERATION_API_KEY: ${GENERATION_API_KEY:-}
  GENERATION_OUTPUT_FORMAT: ${GENERATION_OUTPUT_FORMAT:-tool}
  GENERATION_REASONING_EFFORT: ${GENERATION_REASONING_EFFORT:-low}
  GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-4096}
  AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-2000}
  AI_CONCURRENCY: ${AI_CONCURRENCY:-4}
  EXPORT_STORAGE: ${EXPORT_STORAGE:-local}
  EXPORT_DIRECTORY: /app/data/exports
  EXPORT_S3_ENDPOINT: ${EXPORT_S3_ENDPOINT:-}
  EXPORT_S3_REGION: ${EXPORT_S3_REGION:-us-east-1}
  EXPORT_S3_BUCKET: ${EXPORT_S3_BUCKET:-}
  EXPORT_S3_ACCESS_KEY_ID: ${EXPORT_S3_ACCESS_KEY_ID:-}
  EXPORT_S3_SECRET_ACCESS_KEY: ${EXPORT_S3_SECRET_ACCESS_KEY:-}
  EXPORT_S3_PATH_STYLE: ${EXPORT_S3_PATH_STYLE:-false}
  MEDIA_STORAGE: ${MEDIA_STORAGE:-disabled}
  MEDIA_DIRECTORY: /app/data/media
  MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
  MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
  MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
  MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-}
  MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-}
  MEDIA_S3_LIFECYCLE_VERIFIED_FOR: ${MEDIA_S3_LIFECYCLE_VERIFIED_FOR:-}
  MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-false}

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: grove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a database owner password}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d grove"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: grove-api:local
    command: [node, dist/bootstrap.js]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/grove
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Generate an API database password}
      WORKER_DATABASE_PASSWORD: ${WORKER_DATABASE_PASSWORD:?Generate a worker database password}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [database]

  api:
    build: .
    image: grove-api:local
    restart: unless-stopped
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://grove_api:${API_DATABASE_PASSWORD}@postgres:5432/grove
      SHARE_LINK_KEY: ${SHARE_LINK_KEY:-}
      OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RESEARCH_DAILY_CALL_LIMIT: ${RESEARCH_DAILY_CALL_LIMIT:-20}
      RESEARCH_MONTHLY_BUDGET_USD: ${RESEARCH_MONTHLY_BUDGET_USD:-100}
      API_MAX_IN_FLIGHT: ${API_MAX_IN_FLIGHT:-32}
      API_MAX_QUEUED: ${API_MAX_QUEUED:-32}
      API_QUEUE_TIMEOUT_MS: ${API_QUEUE_TIMEOUT_MS:-250}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-10000}
      API_INTERACTIVE_CONCURRENCY: ${API_INTERACTIVE_CONCURRENCY:-4}
      API_INTERACTIVE_TIMEOUT_MS: ${API_INTERACTIVE_TIMEOUT_MS:-90000}
    ports: ["127.0.0.1:${PORT:-26080}:26080"]
    volumes:
      [
        api-models:/app/data/models,
        exports:/app/data/exports,
        media:/app/data/media,
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [database, outbound]

  worker:
    image: grove-api:local
    command: [node, dist/worker.js]
    restart: unless-stopped
    healthcheck: { disable: true }
    environment:
      <<: *runtime
      DATABASE_URL: postgresql://grove_jobs:${WORKER_DATABASE_PASSWORD}@postgres:5432/grove
      AMQP_URL: ${AMQP_URL:-}
      ORGANIZATION_INTERVAL_SECONDS: ${ORGANIZATION_INTERVAL_SECONDS:-900}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-notifications@mail.usegrove.cloud}
      WORKER_LANES: ${WORKER_LANES:-indexing,enrichment,email,maintenance,bulk}
      INDEXING_CONCURRENCY: ${INDEXING_CONCURRENCY:-2}
      EMAIL_CONCURRENCY: ${EMAIL_CONCURRENCY:-1}
      MAINTENANCE_CONCURRENCY: ${MAINTENANCE_CONCURRENCY:-1}
      BULK_CONCURRENCY: ${BULK_CONCURRENCY:-1}
      JOB_ACCOUNT_CONCURRENCY: ${JOB_ACCOUNT_CONCURRENCY:-2}
      JOB_PROVIDER_CONCURRENCY: ${JOB_PROVIDER_CONCURRENCY:-8}
      WORKER_LEGACY_QUEUE: ${WORKER_LEGACY_QUEUE:-true}
    stop_grace_period: 40s
    volumes:
      [
        worker-models:/app/data/models,
        exports:/app/data/exports,
        media:/app/data/media,
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [database, outbound]

networks:
  database: { internal: true }
  outbound: {}
volumes:
  postgres-data: {}
  api-models: {}
  worker-models: {}
  exports: {}
  media: {}
