name: "qdrant-memory-monorepo"

services:
  qdrant-memory:
    build:
      context: .
      dockerfile: Dockerfile
    image: miniaxolotl/qdrant-memory:latest
    restart: unless-stopped
    user: "1001"

    # Core
    environment:
      TRANSPORT: ${TRANSPORT:-http}
      PORT: ${PORT:-26080}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      COLLECTION_PREFIX: ${COLLECTION_PREFIX:-memory}
      VECTOR_DIM: ${VECTOR_DIM:-384}

      # Optional: remote embedding (falls back to local ONNX if unset)
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-512}

      # Optional: remote reranking (disabled if unset)
      RERANKING_URL: ${RERANKING_URL:-}
      RERANKING_MODEL: ${RERANKING_MODEL:-}

    ports:
      - "${PORT:-26080}:${PORT:-26080}"
      - "${HEALTH_PORT:-26081}:26081"

    volumes:
      - ./data:/app/data:rw

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:26081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    depends_on:
      qdrant:
        condition: service_healthy

    networks:
      - memory-net

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./data/qdrant:/qdrant/storage:rw

    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - memory-net

networks:
  memory-net:
    driver: bridge
